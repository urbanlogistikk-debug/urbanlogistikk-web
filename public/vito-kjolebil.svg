  <path d="M0 216l45-14 31 2 44-13 26 6 44-16 38 8 35-3 31 4 43-17 35 2 51-12 20 4 29-11 23 5 46-15 39 7 35-13 35 5v146H0z" fill="#405d60"/>
  <g fill="#3b5559"><path d="M0 224h25v-19h24v17h22v-30h38v33h15v-19h41v21h361v-52h27v19h13v-34h18v41h12v-21h22v27h22v75H0z"/><path d="M512 238v-31h42v31m48-26v-28h19v28" fill="url(#office)"/></g>
  <g stroke="#a6b3a6" fill="none" stroke-width="1" opacity=".42"><path d="M501 212v-68l45-3m-45 3-15 2m15-5 3-4 29 5m1 1v17M75 224v-59l-23-3 39 2m-16-2 3-4 12 6"/></g>
  <path d="M0 242q156-10 350-7l290-11v66H0z" fill="#30484d"/><path d="M0 266 640 250v54H0z" fill="#536969"/>
  <path d="M0 274 640 258" stroke="#92a59b" opacity=".65"/><path d="M0 285 640 265v205H0z" fill="url(#road)"/>
  <g fill="none"><path d="M0 319 640 282" stroke="#83928d" opacity=".32"/><path d="M0 435 640 356" stroke="#7e8982" opacity=".4"/><path d="M0 456 640 369" stroke="#6a7974" opacity=".25"/><path d="m12 424 103-13m109-13 91-11m102-13 69-8" stroke="#bac3ad" stroke-width="2" opacity=".42"/></g>
  <ellipse cx="322" cy="352" rx="240" ry="18" fill="#102329" opacity=".75" filter="url(#blur)" transform="rotate(3 322 352)"/>
  <g transform="translate(0 31.2) scale(1 .915)">
