  <path d="m299 188 25 1c11 0 20 4 30 14l41 40-99-4z" fill="url(#glass)" stroke="#354b50" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="m303 193 22 1q13 0 24 10l23 23-74-5z" fill="#a9bdb6" opacity=".27"/><path d="m363 216-2 24" stroke="#29434a" stroke-width="3"/>
  <path d="m292 243 102 5 12 12-4 40q-12 9-16 23l-97-7z" fill="none" stroke="#96a9a3" stroke-width="1.1"/>
  <path d="m369 186 37-8c10 7 24 24 34 36l20 21-45 7z" fill="url(#wind)" stroke="#344c53" stroke-width="3" stroke-linejoin="round"/>
  <path d="m375 187 30-6 26 28-41-4z" fill="#cad5c9" opacity=".22"/>
  <path d="m414 239 42-6m-29 1 18-5" stroke="#3c555a" fill="none" stroke-width="1.6" stroke-linecap="round"/>
  <path d="m392 242 13 4 1 4-15-2z" fill="#263e45"/><path d="M378 237q1-5 7-5l13 2q4 1 4 6l-2 6-16-1q-6-1-6-8z" fill="#394f55" stroke="#263d43"/><path d="M382 235q8-2 16 1" stroke="#718889" fill="none"/>
