<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-labelledby="title desc">
  <title id="title">Urban Logistikks kjølebil</title>
  <desc id="desc">Illustrasjon av en hvit Mercedes-Benz Vito med kjøleaggregat og Urban Logistikk på skyvedøren, i et norsk bylandskap.</desc>
  <defs>
    <linearGradient id="sky" x2=".82" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#10282f"/><stop offset=".57" stop-color="#344b50"/><stop offset="1" stop-color="#536769"/></linearGradient>
    <radialGradient id="haze" cx=".77" cy=".43" r=".67"><stop stop-color="#aecab7" stop-opacity=".33"/><stop offset=".62" stop-color="#62807a" stop-opacity=".05"/><stop offset="1" stop-color="#26444a" stop-opacity="0"/></radialGradient>
    <linearGradient id="road" x2=".2" y2="1"><stop stop-color="#455658"/><stop offset=".2" stop-color="#324347"/><stop offset="1" stop-color="#142a31"/></linearGradient>
    <linearGradient id="paint" x1=".42" y1="0" x2=".39" y2="1"><stop stop-color="#fffef7"/><stop offset=".21" stop-color="#ebf1ec"/><stop offset=".48" stop-color="#c7d5d1"/><stop offset=".64" stop-color="#e3eae4"/><stop offset=".84" stop-color="#c7d4cf"/><stop offset="1" stop-color="#859b98"/></linearGradient>
    <linearGradient id="hood" x2=".4" y2=".9"><stop stop-color="#ffffff"/><stop offset=".48" stop-color="#e1e9e3"/><stop offset=".82" stop-color="#f5f6ef"/><stop offset="1" stop-color="#afbfbb"/></linearGradient>
    <linearGradient id="nose" x2=".8" y2=".85"><stop stop-color="#dbe4dc"/><stop offset=".36" stop-color="#eff2e9"/><stop offset=".67" stop-color="#adbeb9"/><stop offset="1" stop-color="#738b88"/></linearGradient>
    <linearGradient id="glass" x1=".12" y1="0" x2=".8" y2="1"><stop stop-color="#9aafac"/><stop offset=".39" stop-color="#506d72"/><stop offset=".73" stop-color="#2b464e"/><stop offset="1" stop-color="#38545c"/></linearGradient>
    <linearGradient id="wind" x1=".2" y1="0" x2=".83" y2="1"><stop stop-color="#b0c0b6"/><stop offset=".42" stop-color="#738f90"/><stop offset=".8" stop-color="#48656d"/><stop offset="1" stop-color="#344f57"/></linearGradient>
    <linearGradient id="trim" x2="0" y2="1"><stop stop-color="#526769"/><stop offset=".25" stop-color="#2b4247"/><stop offset=".66" stop-color="#1b3036"/><stop offset="1" stop-color="#374b4d"/></linearGradient>
    <linearGradient id="steel" x1=".13" y1="0" x2=".89" y2="1"><stop stop-color="#e9eee7"/><stop offset=".27" stop-color="#abb9b5"/><stop offset=".47" stop-color="#627476"/><stop offset=".67" stop-color="#b9c5be"/><stop offset="1" stop-color="#728282"/></linearGradient>
    <linearGradient id="lamp" x1="0" y1="0" x2="1" y2=".76"><stop stop-color="#718a8e"/><stop offset=".25" stop-color="#e9f3ec"/><stop offset=".55" stop-color="#b5c6bf"/><stop offset="1" stop-color="#e6efe8"/></linearGradient>
    <radialGradient id="rubber" cx=".4" cy=".32" r=".75"><stop stop-color="#394448"/><stop offset=".62" stop-color="#243136"/><stop offset=".87" stop-color="#151f24"/><stop offset="1" stop-color="#273538"/></radialGradient>
    <filter id="blur" x="-.25" y="-.6" width="1.5" height="2.2"><feGaussianBlur stdDeviation="6"/></filter>
    <g id="wheel">
      <circle r="31" fill="url(#rubber)" stroke="#111e22" stroke-width="1.2"/><circle r="26.8" fill="none" stroke="#64716e" stroke-width=".7" opacity=".56"/>
      <circle r="20" fill="#111e22" stroke="#82918c" stroke-width="1"/><circle r="18.6" fill="url(#steel)"/>
      <g fill="#344247"><ellipse cy="-12" rx="3.4" ry="4.1"/><ellipse cy="-12" rx="3.4" ry="4.1" transform="rotate(45)"/><ellipse cy="-12" rx="3.4" ry="4.1" transform="rotate(90)"/><ellipse cy="-12" rx="3.4" ry="4.1" transform="rotate(135)"/><ellipse cy="-12" rx="3.4" ry="4.1" transform="rotate(180)"/><ellipse cy="-12" rx="3.4" ry="4.1" transform="rotate(225)"/><ellipse cy="-12" rx="3.4" ry="4.1" transform="rotate(270)"/><ellipse cy="-12" rx="3.4" ry="4.1" transform="rotate(315)"/></g>
      <circle r="8" fill="url(#steel)" stroke="#647575" stroke-width=".7"/><circle r="3.7" fill="#34464a"/>
    </g>
    <pattern id="office" width="10" height="9" patternUnits="userSpaceOnUse"><path d="M2 3h4" stroke="#a4b7a7" stroke-width="2" opacity=".4"/></pattern>
  </defs>
