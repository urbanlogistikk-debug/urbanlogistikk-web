  <path d="M96 192q1-8 9-9l174 1q7 0 7 7l-3 61-193-8z" fill="#eef3ec" opacity=".42"/>
  <path d="M166 182q-4 33-5 66m0 11-2 23m124-98c7 1 9 3 9 9l-4 124q0 8-7 8l-92-7" fill="none" stroke="#8c9f9b" stroke-width="1.25"/>
  <path d="M91 252q45 1 85 4" fill="none" stroke="#a5b7b1" stroke-width="4" stroke-linecap="round"/><path d="m94 252 78 4" stroke="#718886" stroke-width="1.6" stroke-linecap="round"/>
  <path d="m188 303 101 7 103 5" fill="none" stroke="#edf2ea" stroke-width="2"/><path d="m192 318 197 14-1 10-197-15z" fill="url(#trim)"/>
  <path d="M81 311l40 3-3 9-32-2q-7-1-5-10z" fill="url(#trim)"/>
  <path d="M119 319q5-35 36-34c19 0 31 13 35 34m202 15q5-37 35-36c18 1 31 15 35 34" fill="none" stroke="#f1f5ee" stroke-width="2"/>
  <path d="M83 228l8 1-2 44-9-1z" fill="#943d37"/><path d="m83 234 6 1-1 13-6-1" fill="#dc6d5a"/><path d="m82 254 6 .5-.5 7-6-.5" fill="#dfd9c7"/>
