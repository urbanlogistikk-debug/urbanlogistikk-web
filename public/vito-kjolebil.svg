  <path d="M77 302c-1-25 1-62 6-97 2-19 7-30 22-33 43-5 150-5 221-3 20 1 34 7 48 22l46 48c25 4 48 10 65 18 14 7 20 21 21 41l-2 38-44 13-3-10c-2-19-13-32-31-33-21-1-33 16-34 37l-1 5-202-15-1-9c-1-18-13-30-31-31-21-1-32 14-34 32l-1 4-34-3c-10-1-13-10-12-24z" fill="url(#paint)" stroke="#658081" stroke-width="1.6"/>
  <path d="M87 203q2-25 18-28c64-5 143-4 219-2 17 0 28 5 39 15" fill="none" stroke="#fcfff8" stroke-width="2"/>
  <path d="M107 173c62-5 147-5 219-3 15 0 26 6 35 13l45-7c-11-10-23-14-41-15-93-3-191-1-239 5z" fill="#eff3ed" stroke="#c3d0ca" stroke-width="1"/>
  <path d="m130 166 203-1 25 2m-195 2 174-1" fill="none" stroke="#adbeb8" stroke-linecap="round" opacity=".55"/>
