  <g transform="translate(1 1)"><path d="m251 167 8-2 52 1 9 4-12 4-53-2z" fill="#758c89" opacity=".7"/><path d="m247 163 3-8q2-6 9-7l41-3q12 0 18 6l5 7-13 9-56-1z" fill="#eef2e9" stroke="#9cafa8" stroke-width="1.2"/><path d="m251 155 53 1 14-5m-14 5 5 10" fill="none" stroke="#c6d4cb"/><path d="m311 156 9-3 2 5-10 6z" fill="#627778"/><path d="m254 159 46 1m-45 2 45 1" stroke="#9cafa9" stroke-width="1.1"/></g>
  <!-- Short sculpted hood and foreshortened face, including the Mercedes twin-bar grille. -->
  <path d="m416 243 44-8c22 2 49 8 68 16 10 5 16 10 22 18l-52 14c-8-11-15-17-27-23z" fill="url(#hood)" stroke="#9bafaa" stroke-width="1.2"/>
  <path d="M430 244q35 6 62 18m-28-24q37 5 60 18" fill="none" stroke="#fcfdf6" stroke-width="1.7"/>
  <path d="m499 279 51-13q7 13 6 39l-3 14q-20 14-50 23l-36 7-6-10 32-11z" fill="url(#nose)" stroke="#718989" stroke-width="1.4"/>
  <path d="m500 280 50-12-2 19-44 15-8-13z" fill="#253a40" stroke="#829797" stroke-width="1.2"/>
  <path d="m500 284 47-13m-43 21 43-14" fill="none" stroke="#c6d0c8" stroke-width="2.6"/>
  <g transform="translate(526 283) matrix(.80 -.25 0 1 0 0)"><circle r="9.8" fill="#293d42" stroke="#d9e2da" stroke-width="1.6"/><path d="m0-8.2 1.1 7 5.8 5.3-7-3.5-7.1 3.5L-1.2-1.1z" fill="#e7ece5"/></g>
  <path d="m453 261 14 1q17 2 29 12l8 13-16-3-20-10z" fill="url(#lamp)" stroke="#708787" stroke-width="1.5"/>
  <path d="m460 264 13 2q14 3 22 11l4 5-15-5" fill="none" stroke="#f5fbef" stroke-width="2.5" stroke-linecap="round"/>
  <path d="m472 270 10 3 4 5-9-3z" fill="#728d90"/><path d="m548 269 4-3 3 9-6 4z" fill="url(#lamp)" stroke="#879a95"/>
  <path d="m470 298 28 6 54-18-1 7-51 20-29-5z" fill="#c1cec7"/>
  <path d="m464 320 31 2 55-20-2 12-52 21-33 1z" fill="url(#trim)" stroke="#536a6c"/>
  <path d="m474 323 17 1m8 4 45-17" stroke="#6f8482" stroke-width="1.1"/><path d="m508 307 28-10v8l-28 10z" fill="#e7eae0" stroke="#83938d" stroke-width=".8"/><path d="m508 307 3-1v8l-3 1z" fill="#638198"/>
  <path d="m472 340 25-3 52-20" stroke="#aebeb5" stroke-width="2" fill="none"/>
  <path d="m78 340 17 1m440 1 19-3" stroke="#95a097" opacity=".24"/>
  </g>
</svg>
