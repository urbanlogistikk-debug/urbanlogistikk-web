  <g fill="#405457" stroke="#8ea29b" stroke-width="1"><rect x="270" y="255" width="15" height="4.4" rx="2.2" transform="rotate(3 270 255)"/><rect x="298" y="256" width="15" height="4.5" rx="2.2" transform="rotate(3 298 256)"/></g>
  <g transform="matrix(1 .035 -.025 1 178 219)" font-family="Arial,Helvetica,sans-serif"><rect x="0" y="-13" width="23" height="23" rx="5" fill="#d6f36a"/><text x="4" y="3.5" fill="#213338" font-weight="bold" font-size="12">UL</text><text x="29" y="-1" fill="#22383c" font-size="13" font-weight="bold" letter-spacing="1.4">URBAN</text><text x="29.5" y="8" fill="#4c6765" font-size="6.1" font-weight="bold" letter-spacing="1.8">LOGISTIKK</text></g>
